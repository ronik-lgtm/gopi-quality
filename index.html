<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Yarn Stock Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<style>
:root{--brand:#A20013;--brand-d:#7F000F;--brand-bg:#FBF0F1;--char:#4C4C4C;--bg:#F6F6F7;--card:#fff;--ink:#1F1F1F;--mut:#6B6B6B;--line:#E7E7E9;--acc:var(--brand);--accbg:var(--brand-bg);--warn:#9A5B00;--warnbg:#FFF8EB;--bad:#B3121F;--badbg:#FDF1F2;--ok:#1E7A4F;--okbg:#EEF8F2;--r:12px}
*{box-sizing:border-box}
body{margin:0;font:14px/1.5 Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
a{color:var(--brand)}
.top{display:flex;align-items:center;gap:12px;padding:0 20px;background:#fff;color:var(--ink);position:sticky;top:0;z-index:6;height:60px;border-bottom:1px solid var(--line)}
.top img{height:34px;width:auto;display:block}
.brand{display:flex;flex-direction:column;line-height:1.15;padding-left:12px;border-left:1px solid var(--line)}
.brand b{font-size:15px;font-weight:600;color:var(--char);letter-spacing:-.01em}
.brand small{color:var(--mut);font-size:11px}
.top .sp{flex:1}
.chip{font-size:11px;font-weight:500;padding:4px 10px;border-radius:999px;background:#F1F1F2;color:var(--char);white-space:nowrap;border:0}
.chip.warn{background:var(--warnbg);color:var(--warn)}
.chip.ok{background:var(--okbg);color:var(--ok)}
.chip.ok::before{content:'';display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--ok);margin-right:6px;vertical-align:1px}
#signout{background:transparent;color:var(--mut)!important;border:1px solid var(--line)}
#signout:hover{color:var(--brand)!important;border-color:var(--brand)}
#nav{display:flex;gap:2px;padding:0 20px;background:#fff;border-bottom:1px solid var(--line);overflow-x:auto;position:sticky;top:60px;z-index:5}
#nav a{padding:13px 12px 11px;color:var(--mut);text-decoration:none;font-weight:500;white-space:nowrap;border-bottom:2px solid transparent}
#nav a:hover{color:var(--ink)}
#nav a.on{color:var(--brand);border-bottom-color:var(--brand);font-weight:600}
main{max-width:1280px;margin:0 auto;padding:24px 20px 60px}
h1{font-size:22px;font-weight:600;letter-spacing:-.02em;margin:0 0 16px;color:var(--ink)}
h2{font-size:15px;font-weight:600;margin:0 0 12px;color:var(--ink)}
h3{font-size:13px;font-weight:600;margin:16px 0 8px;color:var(--char);text-transform:uppercase;letter-spacing:.05em}
.mut{color:var(--mut)}
.small{font-size:12px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.kpi .l{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em;font-weight:500}
.kpi .v{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;margin-top:4px;color:var(--ink);letter-spacing:-.02em}
.kpi .s{font-size:12px;color:var(--mut);margin-top:2px}
.kpi.warn{border-color:#F3D9A8;background:var(--warnbg)}
.kpi.bad{border-color:#F2C4C8;background:var(--badbg)}
.kpi.est{border-style:dashed}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-top:16px}
.tbl{overflow:auto;max-height:72vh;border:1px solid var(--line);border-radius:10px;background:#fff}
table{width:100%;border-collapse:collapse}
th,td{padding:10px 12px;border-bottom:1px solid #F0F0F1;text-align:left;vertical-align:top}
th{font-size:11px;color:var(--mut);font-weight:500;text-transform:uppercase;letter-spacing:.05em;position:sticky;top:0;background:#FAFAFA;z-index:1;white-space:nowrap;border-bottom:1px solid var(--line)}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr:last-child td{border-bottom:0}
tr.click{cursor:pointer}
tr.click:hover td{background:#FAFAFA}
tr.sub td{background:#FCFCFC;padding:0}
tr.void td{opacity:.45;text-decoration:line-through}
tr.tot td{font-weight:600;background:#FAFAFA}

.setdd{display:block;border:0;background:none;padding:2px 0;margin-top:2px;font:inherit;font-size:12.5px;color:var(--mut);cursor:pointer;text-align:left}.setdd:hover{color:var(--brand)}
table.mini{width:100%;border-collapse:collapse;font-size:12.5px;background:#FAFAFA;border:1px solid var(--line);border-radius:8px}table.mini th,table.mini td{padding:5px 10px;border-bottom:1px solid var(--line);text-align:left;font-weight:normal}table.mini th{color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:.03em}table.mini td.n,table.mini th.n{text-align:right}
.setlist{font-size:12.5px;color:var(--mut);background:#FAFAFA;border:1px solid var(--line);border-radius:8px;padding:6px 10px;margin-top:4px;line-height:1.7}
.pie{margin-bottom:16px}.pierow{display:flex;gap:28px;align-items:center;flex-wrap:wrap}.pie svg{flex:0 0 auto}.pie path{transition:opacity .15s;cursor:default}
.pc1{font-size:20px;font-weight:700;fill:var(--ink)}.pc2{font-size:11px;fill:var(--mut)}
.pieleg{flex:1;min-width:260px;border-collapse:collapse;font-size:13.5px}.pieleg td{padding:6px 8px;border-bottom:1px solid var(--line)}.pieleg td.n{text-align:right;white-space:nowrap}.pieleg tr.on td{background:#FAFAFA}
.sw{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:8px;vertical-align:-1px}
.lnk{border:0;background:none;color:var(--brand);cursor:pointer;padding:0 2px;font:inherit;text-decoration:underline}
tr.grp td{background:#F6F6F7;font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--char)}
.neg{color:var(--bad);font-weight:600}
.badge{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:500;white-space:nowrap;color:var(--c,#555);background:color-mix(in srgb,var(--c,#555) 11%,#fff);border:1px solid color-mix(in srgb,var(--c,#555) 22%,#fff)}
.pill{display:inline-block;padding:1px 8px;border-radius:999px;font-size:11px;font-weight:500;white-space:nowrap}
.pill.warn{background:var(--warnbg);color:var(--warn)}
.pill.bad{background:var(--badbg);color:var(--bad)}
.pill.ok{background:var(--okbg);color:var(--ok)}
.pill:not(.warn):not(.bad):not(.ok){background:#EFEFF1;color:var(--mut)}
.pill.n{background:#F1F1F2;color:var(--char)}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
input,select,textarea{font:inherit;padding:9px 11px;border:1px solid #DCDCDF;border-radius:8px;background:#fff;min-width:0;color:var(--ink);transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--brand);box-shadow:0 0 0 3px rgba(162,0,19,.12)}
input:disabled{background:#F6F6F7;color:var(--mut)}
textarea{min-height:56px;resize:vertical}
.btn{font:inherit;font-weight:500;border:1px solid #DCDCDF;background:#fff;color:var(--ink);padding:9px 16px;border-radius:8px;cursor:pointer;transition:background .15s,border-color .15s}
.btn:hover{background:#F6F6F7}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{background:var(--brand-d);border-color:var(--brand-d)}
.btn.danger{color:var(--bad);border-color:#F2C4C8}
.btn.danger:hover{background:var(--badbg)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--brand);padding:6px 8px}
.btn.sm{padding:5px 11px;font-size:12px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.tile{font:inherit;border:1px solid var(--line);background:#fff;border-radius:var(--r);padding:16px 18px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:4px;color:var(--ink);position:relative;transition:border-color .15s,transform .15s}
.tile::before{content:'';width:8px;height:8px;border-radius:50%;background:var(--c);margin-bottom:6px}
.tile:hover{border-color:var(--brand);transform:translateY(-1px)}
.tile b{font-size:14px;font-weight:600}
.tile span{font-size:12px;color:var(--mut)}
.tiles h3{grid-column:1/-1;margin:12px 0 0}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}
.form label{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:500;color:var(--char)}
.form .full{grid-column:1/-1}
.form .hint{font-weight:400;color:var(--mut);font-size:11px}
.actions{display:flex;gap:8px;justify-content:flex-end;align-items:center;flex-wrap:wrap}
.fhead{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.fhead h2{margin:0;font-size:17px}
.note{background:#F7F7F8;border:1px solid var(--line);color:var(--char);border-radius:10px;padding:10px 14px;font-size:13px}
.note b{color:var(--ink)}
.note.warn{background:var(--warnbg);border-color:#F3D9A8;color:#6B4200}
.note.bad{background:var(--badbg);border-color:#F2C4C8;color:#7A0C16}
.note+.note{margin-top:6px}
.grid-in{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.grid-in label{font-size:11px}
.grid-in input{padding:7px 8px}
.modal{position:fixed;inset:0;background:rgba(20,20,22,.4);display:flex;align-items:center;justify-content:center;z-index:20;padding:12px;backdrop-filter:blur(2px)}
.modal.hidden{display:none}
.sheet{background:#fff;border-radius:16px;max-width:680px;width:100%;max-height:92vh;overflow:auto;padding:22px;box-shadow:0 20px 50px rgba(0,0,0,.12)}
#login{background:var(--bg)!important;backdrop-filter:none}
#login .sheet{box-shadow:none;border:1px solid var(--line);text-align:center}
#login .sheet img{width:150px;margin:6px auto 10px;display:block}
#login .form{text-align:left}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--char);color:#fff;padding:10px 18px;border-radius:10px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:30;max-width:90vw;font-weight:500}
#toast.show{opacity:1}
#toast.err{background:var(--bad)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.empty{padding:28px;text-align:center;color:var(--mut)}
code{font-size:12px;background:#F1F1F2;padding:1px 6px;border-radius:4px}
.dash-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
.dash-head h1{margin:0}
th.sortable{cursor:pointer;user-select:none}
th.sortable:hover{color:var(--brand)}
.sarr{color:var(--brand)}
tr.lotrow td{background:#FCFCFC;font-size:13px}
tr.lotrow td:first-child{padding-left:30px}
.seg{display:inline-flex;background:#EFEFF1;border-radius:10px;padding:3px;gap:2px}
.seg button{font:inherit;font-size:13px;border:0;background:transparent;padding:6px 12px;border-radius:8px;color:var(--mut);cursor:pointer}
.seg button.on{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.big3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.bigc{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px 22px;border-top:4px solid var(--brand)}
.bigc .l{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);font-weight:500}
.bigc .v{font-size:36px;font-weight:600;letter-spacing:-.02em;margin-top:6px;font-variant-numeric:tabular-nums}
.bigc .v span{font-size:16px;color:var(--mut);font-weight:500}
.bigc .s{font-size:13px;color:var(--mut);margin-top:2px}
h3.sec{margin:26px 0 10px}
.stages{display:flex;align-items:stretch;gap:10px}
.stages .stg{flex:1;background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.stages .arr{display:flex;align-items:center;color:#BDBDC2;font-size:22px}
.stg .l{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);font-weight:500}
.stg .v{font-size:24px;font-weight:600;margin-top:4px;font-variant-numeric:tabular-nums}
.stg .s{font-size:12px;color:var(--mut);margin-top:2px}
.stages.w .stg{border-left:4px solid #D9A441;border-radius:0 12px 12px 0}
@media(max-width:720px){.big3{grid-template-columns:1fr}.bigc .v{font-size:30px}.stages{flex-direction:column}.stages .arr{justify-content:center;transform:rotate(90deg);height:18px}.dash-head{flex-wrap:wrap}}
.hero{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.hero .kpi{padding:18px 20px}
.hero .kpi .v{font-size:28px}
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(420px,1fr));gap:16px;margin-top:16px}
.charts .card{margin-top:0}
.chart-box{position:relative}
.chart-box svg{display:block;width:100%;height:auto;overflow:visible}
.chart-box .mk{transition:opacity .12s}
.chart-box .hit{fill:transparent}
.chart-box .hit:hover+.hl{opacity:1}
.lg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--char);margin:0 0 8px}
.lg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.ctip{position:absolute;pointer-events:none;background:#2B2B2B;color:#fff;font-size:12px;padding:7px 10px;border-radius:8px;white-space:nowrap;opacity:0;transition:opacity .1s;z-index:3}
.ctip b{font-weight:600}
.chart-sub{font-size:12px;color:var(--mut);margin:-8px 0 10px}
details.card>summary{cursor:pointer;font-weight:600;list-style:none;display:flex;align-items:center;gap:8px}
details.card>summary::before{content:'▸';color:var(--mut)}
details.card[open]>summary::before{content:'▾'}
details.card[open]>summary{margin-bottom:6px}
@media(max-width:720px){.charts{grid-template-columns:1fr}.hero{grid-template-columns:1fr 1fr;gap:10px}.hero .kpi{padding:12px 14px}.hero .kpi .v{font-size:20px}}
.fac-h{display:flex;align-items:baseline;gap:10px;margin:22px 0 10px}
.fac-h h2{margin:0;font-size:16px}
@media(max-width:720px){
  main{padding:14px 12px 60px}
  .top{padding:0 12px}
  #nav{padding:0 8px}
  .kpi .v{font-size:18px}
  .hide-sm{display:none}
  input,select,textarea{font-size:16px}
  .grid2{grid-template-columns:1fr}
  .brand small{display:none}
  th,td{padding:8px}
  #role{display:none}
}
</style>
</head>

<script>
/* ============================================================
   Supabase adapter — gives the app the same small document API
   (doc / collection / get / set / update / onSnapshot) it was built on.
   moves  table  ← paths  mv/<YYYY-MM>/e/<id>
   docs   table  ← every other path (cfg/settings, yarns/<id>, parties/<id>, creels/<id>, close/<YYYY-MM>)
   ============================================================ */
const AUTH_URL = {recovery: /type=recovery/.test(location.hash + location.search), error: (() => { const p = new URLSearchParams((location.hash || '').replace(/^#/, '') + '&' + location.search.replace(/^\?/, '')); return p.get('error_description') || p.get('error_code') || ''; })()};
const SB = (() => {
  const C = window.YT_CONFIG || {};
  if (!window.supabase || !C.supabaseUrl || /YOUR-/.test(C.supabaseUrl + C.supabaseKey)) return null;
  return window.supabase.createClient(C.supabaseUrl, C.supabaseKey);
})();
const Adapter = (() => {
  const listeners = new Set();
  const segs = p => p.split('/');
  const isMovePath = p => p.startsWith('mv/');
  const dbErr = e => ({code: e && (e.code === '42501' || /row-level security|closed/i.test(e.message || '')) ? 'invalid_argument' : 'unavailable', message: (e && e.message) || 'Database error'});
  const meta = {fromCache: false, hasPendingWrites: false};
  const deepMerge = (a, b) => { const o = Object.assign({}, a); for (const k in b) { const v = b[k]; o[k] = v && typeof v === 'object' && !Array.isArray(v) && a && typeof a[k] === 'object' && !Array.isArray(a[k]) ? deepMerge(a[k], v) : v; } return o; };
  async function fetchAll(q) { const out = []; for (let from = 0; ; from += 1000) { const {data, error} = await q().range(from, from + 999); if (error) throw dbErr(error); out.push(...data); if (data.length < 1000) break; } return out; }

function genMach(f, k, n) { const out = []; for (let i = 1; i <= n; i++) { const c = `${f}-${k}${String(i).padStart(2, '0')}`; out.push({id: c, c, f, k, a: true}); } return out; }

function pieCard(raw, title) {

function monthFlows(list, f) {
  const o = {grn: 0, issY: 0, issU: 0, ret: 0, ww: 0, wwc: 0, bk: 0, dry: 0, ev: 0, fab: 0, clr: 0, cbn: 0, kw: 0, soldW: 0, soldK: 0, soldCb: 0, soldCbKg: 0, loss: 0, cbi: 0, btrIn: 0, btrOut: 0};
  for (const x of list) {
    if (x.v) continue; const xf = x.t === 'BMI' || x.t === 'BTR' ? null : (x.f || facOfLoc(x.to) || facOfLoc(x.fr));
    switch (x.t) {
      case 'GRN': if (xf === f) o.grn += x.kg; break;
      case 'ISS': if (xf === f) { if (x.src === 'U') o.issU += x.kg; else o.issY += x.kg; } break;
      case 'RTN': if (xf === f) o.ret += x.kg; break;
      case 'WST': if (xf === f) o.ww += x.kg; break;
      case 'WWC': if (xf === f) o.wwc += x.kg; break;
      case 'BMI': if (x.f === f) { o.bk += x.bk; o.ev += x.ev || 0; } if ((x.cf || x.f) === f) o.dry += x.kg; break;
      case 'BTR': if (x.f === f) { o.bk += x.bk; o.ev += x.ev || 0; o.btrIn += x.bk; } if (x.cf === f) { o.dry += x.kg; o.btrOut += x.bk; } break;
      case 'FAB': if (xf === f) o.fab += x.tot || 0; break;
      case 'CLR': if (x.f === f) { if (x.to.startsWith('KW:')) o.kw += x.kg; else { o.clr += x.kg; o.cbn += x.bx || 0; } } break;
      case 'CBI': if (x.f === f) o.cbi += x.kg; break;
      case 'WSL': if (xf === f) { if (x.fr.startsWith('WW:')) o.soldW += x.kg; else if (x.fr.startsWith('P:')) { o.soldCbKg += x.kg; o.soldCb += x.bx || 0; } else o.soldK += x.kg; } break;
      case 'ADJ': if (x.to === 'LOSS' && xf === f) o.loss += x.kg; break;
    }
  }
  o.iss = o.issY + o.issU; o.net = o.iss - o.ret; o.warpLoss = o.ww + o.wwc;
  return o;
}

  const cols = ['Date', 'Type', 'Yarn', 'Lot', 'From', 'To', 'Factory', 'Kg', 'Beam kg', 'Evaporation kg', 'Spools/beams', 'Party', 'Ref', 'Bill date', 'Set', 'Remarks', 'Void', 'Entered by', 'Entered at'];
  const q = s => { s = String(s ?? ''); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  const lines = [cols.join(',')].concat(rows.map(x => [x.d, (T[x.t] || {}).n || x.t, x.y === '*' ? '' : yName(x.y), x.l !== '*' ? x.l : (x.tl || ''), x.t === 'FAB' ? 'Machines' : locName(x.fr), locName(x.to), fName(x.f), x.kg, x.bk || '', x.ev || '', x.bx || x.n || '', pName(x.p), x.ref, x.bd || '', x.set, x.rm, x.v ? 'VOID ' + (x.vr || '') : '', who(x.by), x.at].map(q).join(',')));
  await saveCsv('﻿' + lines.join('\n'), `yarn-register-${UI.reg.m === 'open' ? openFrom() + '-to-' + today() : UI.reg.m}.csv`);
}
function voidCheck(x) {
  let block = '';
  const grpMoves = x.grp ? allMoves().filter(m => m.grp === x.grp && !m.v) : [x];
  const setMoves = grpMoves.filter(m => m.sid && m.snew);
  // Voiding removes stock from wherever the entry put it: refuse if that stock has already been used
  const need = {};
  for (const m of grpMoves) {
    if (m.t === 'FAB') continue; const [tp] = locParts(m.to || '');
    if (!['Y', 'U', 'WD', 'P', 'WW', 'KW'].includes(tp)) continue;
    const ly = m.t === 'BMI' ? '*' : (m.ty || m.y), ll = m.t === 'BMI' ? '*' : (m.tl || m.l); const add = m.t === 'BTR' ? r3(m.bk - (m.ev || 0)) : m.kg;
    if (!(add > 0)) continue; const k = key(ly, ll, m.to); need[k] = r3((need[k] || 0) + add);
  }
  for (const m of setMoves) { const s = S.sets[m.sid]; if (!block && s && s.loc !== m.snew) block = `Beam set ${m.set || ''} has moved since this entry (now: ${s.loc === 'sold' ? 'sold' : s.loc === 'done' ? 'finished' : locName(s.loc)}). Void the later entry first.`; }
  if (!block) for (const k in need) { const [ly, ll, loc] = k.split('|'); const av = bal1(ly, ll, loc); if (need[k] > av + EPS) { block = `Voiding would make ${ll.startsWith('S:') ? 'this beam set' : ll === '*' ? 'the stock' : 'lot ' + ll} at ${locName(loc)} negative (only ${fmt(av)} kg left). Some of it has already been used: void the later entries first, or use an Adjustment.`; break; } }
  return {block, grpMoves, setMoves};
}
function voidDialog(id) {
  const x = allMoves().find(m => m.id === id); if (!x) return;
  const {block, grpMoves, setMoves} = voidCheck(x);
  openModal(`<h2>Void entry</h2><table><tbody>${grpMoves.map(m => moveRow(m, false)).join('')}</tbody></table>
    ${block ? `<div class="note bad" style="margin-top:10px">${esc(block)}</div><div class="actions" style="margin-top:12px"><button class="btn" id="mx">Close</button></div>` :
    `<form id="vf" class="form" style="margin-top:12px"><label class="full">Reason *<input name="r" required placeholder="e.g. wrong machine entered"></label><div class="full actions"><button type="button" class="btn" id="mx">Cancel</button><button class="btn danger" type="submit">Void</button></div></form>`}`);
  $('#mx').onclick = closeModal;
  const vf = $('#vf'); if (!vf) return;
  vf.onsubmit = async e => {
    e.preventDefault();
    try {
      const vmark = {v: true, vb: myId || '', va: new Date().toISOString(), vr: vf.r.value.trim()};
      const moves = grpMoves.map(m => { const d = Object.assign({}, m, vmark); delete d.id; return {id: m.id, data: d}; });
      const sets = [], expect = [];
      for (const m of setMoves) { if (!S.sets[m.sid]) continue; const back = {loc: m.sprev}; if (m.spcb !== undefined) back.cb = m.spcb; if (m.spw !== undefined) back.w = m.spw; if (m.spm !== undefined) back.m = m.spm; sets.push({id: m.sid, data: back, merge: true}); expect.push({id: m.sid, no: m.set || '', loc: m.snew}); }
      await db.batch({moves, sets, expect});
      toast('Entry voided'); closeModal();
    }
    catch (err) { toast('Could not void: ' + (err.message || err.code), true); }
  };
}

    <div class="actions" style="margin-top:12px"><button class="btn" id="mx">Cancel</button>${neg ? '' : '<button class="btn primary" id="mc">Close month</button>'}</div>`);

    const rates = {}; const allR = getRates(); for (const k in allR) if (Object.keys(obj).some(o => o.startsWith(k + '|'))) rates[k] = allR[k];

    const creels = {}; for (const id in A) { const c = S.creels[id]; if (c && c.st !== 'done') { const a = A[id]; creels[id] = {iss: r3(a.iss), sp: a.sp, ret: r3(a.ret), rsp: a.rsp, ww: r3(a.ww), wwc: r3(a.wwc), bk: r3(a.bk), dry: r3(a.dry), ev: r3(a.ev), nb: a.nb, sets: a.sets, last: a.last}; } }

  if (!SB) { S.noDb = true; setStatus('Not configured', 'warn'); render(); return; }
  let recovery = AUTH_URL.recovery;
  SB.auth.onAuthStateChange((ev, s) => { if (ev === 'SIGNED_OUT') location.reload(); if (ev === 'PASSWORD_RECOVERY') recovery = true; SESSION = s || SESSION; });
  const {data} = await SB.auth.getSession(); SESSION = data.session;
  if (/access_token|refresh_token|type=|error/.test(location.hash)) history.replaceState(null, '', location.pathname + '#stock');
  if (!SESSION) { showLogin(); if (AUTH_URL.error) $('#lerr').textContent = 'That reset link has expired or was already used. Request a new one below.'; return; }
  if (recovery) { setNewPasswordScreen(); return; }
  const {data: prof} = await SB.from('profiles').select('id,name,role,email').eq('id', SESSION.user.id).maybeSingle();
  PROFILE = prof;
  $('#signout').style.display = ''; $('#signout').onclick = () => SB.auth.signOut();
  if (!PROFILE || PROFILE.role === 'blocked') { setStatus('No access', 'warn'); $('#app').innerHTML = `<div class="card note warn">Your login (${esc(SESSION.user.email)}) has no access yet. Ask the admin to set your role.</div>`; return; }
  init();
}
function setNewPasswordScreen() {
  $('#login').classList.remove('hidden'); $('#app').innerHTML = '';
  const sheet = $('#login .sheet');
  sheet.querySelectorAll('form').forEach(f => f.style.display = 'none'); $('#lsub').textContent = 'Choose a new password';
  const f = document.createElement('form'); f.className = 'form'; f.style.gridTemplateColumns = '1fr';
  f.innerHTML = `<p class="small mut" style="margin:0">Set a new password for <b>${esc(SESSION.user.email)}</b>.</p>
    <label>New password<input type="password" name="pw1" autocomplete="new-password" minlength="8" required><span class="hint">At least 8 characters.</span></label>
    <label>Repeat new password<input type="password" name="pw2" autocomplete="new-password" minlength="8" required></label>
    <div id="pwerr" class="small" style="color:var(--bad)"></div>
    <button class="btn primary" type="submit" id="pwgo">Save new password</button>`;
  sheet.appendChild(f);
  f.onsubmit = async e => {
    e.preventDefault(); const er = $('#pwerr'); er.textContent = '';
    const p1 = f.pw1.value, p2 = f.pw2.value;
    if (p1.length < 8) { er.textContent = 'Password must be at least 8 characters.'; return; }
    if (p1 !== p2) { er.textContent = 'The two passwords don’t match.'; return; }
    const b = $('#pwgo'); b.disabled = true; b.textContent = 'Saving…';
    const {error} = await SB.auth.updateUser({password: p1});
    if (error) { er.textContent = error.message; b.disabled = false; b.textContent = 'Save new password'; return; }
    AUTH_URL.recovery = false; f.remove(); $('#lf').style.display = ''; $('#login').classList.add('hidden');
    toast('Password updated. You are signed in.'); boot();
  };
}
function showLogin() {
  setStatus('Signed out'); $('#login').classList.remove('hidden'); $('#app').innerHTML = '';
  $('#forgot').onclick = () => { $('#lf').style.display = 'none'; $('#rf').style.display = ''; $('#lsub').textContent = 'Reset your password'; $('#rf').email.value = $('#lf').email.value; $('#rmsg').textContent = ''; };
  $('#back2').onclick = () => { $('#rf').style.display = 'none'; $('#lf').style.display = ''; $('#lsub').textContent = 'Sign in with the login your admin created for you.'; };
  $('#rf').onsubmit = async e => {
    e.preventDefault(); const m = $('#rmsg'); const btn = e.target.querySelector('.primary'); btn.disabled = true;
    const {error} = await SB.auth.resetPasswordForEmail(e.target.email.value.trim(), {redirectTo: location.origin + location.pathname});
    btn.disabled = false;
    if (error && /rate|seconds|limit/i.test(error.message)) { m.style.color = 'var(--bad)'; m.textContent = 'Too many requests. Please wait a minute and try again.'; return; }
    m.style.color = 'var(--ok)'; m.textContent = 'If that email has an account, a reset link is on its way. Check your inbox (and spam). The link works once.';
  };
  $('#lf').onsubmit = async e => {
    e.preventDefault(); const f = e.target; $('#lerr').textContent = '';
    const {error} = await SB.auth.signInWithPassword({email: f.email.value.trim(), password: f.pw.value});
    if (error) { $('#lerr').textContent = error.message; return; }
    $('#login').classList.add('hidden'); boot();
  };
}
boot();
</script>
</body>
</html>
